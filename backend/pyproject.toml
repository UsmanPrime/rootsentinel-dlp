[project]
name = "rootsentinel-core"
version = "0.2.0"
description = "Deterministic fingerprint and Merkle foundation for RootSentinel DLP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0", "pydantic==2.14.2", "sqlalchemy==2.0.55",
    "alembic==1.20.1", "argon2-cffi==25.1.0", "uvicorn==0.54.0",
    "psycopg[binary]==3.3.7",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
