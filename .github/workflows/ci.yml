name: Backend and frontend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pytest
        working-directory: backend
      - run: python -B scripts/fixtures.py
      - run: python -B scripts/cdc_vectors.py
      - run: python -B scripts/frontend_contracts.py --check
      - run: git diff --exit-code
  browser:
    runs-on: ubuntu-latest
    env:
      ROOTSENTINEL_ORIGIN: http://127.0.0.1:5173
      ROOTSENTINEL_API_PORT: '8000'
      ROOTSENTINEL_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - run: python -m pip install -r backend/requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Build the interface
        run: npm run build
        working-directory: frontend
        env:
          ROOTSENTINEL_FRONTEND_DIST: ${{ runner.temp }}/rootsentinel-ui
      - name: Real browser and adversarial acceptance (built interface served by the API, enforced CSP)
        shell: bash
        env:
          ROOTSENTINEL_FRONTEND_DIR: ${{ runner.temp }}/rootsentinel-ui
          ROOTSENTINEL_API_PORT: '5173'
        run: |
          export ROOTSENTINEL_BROWSER_STATE="$RUNNER_TEMP/rootsentinel-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export ROOTSENTINEL_BROWSER_EVIDENCE="$RUNNER_TEMP/rootsentinel-browser-evidence"
          (cd backend && python -B -m tests.browser_server) > "$RUNNER_TEMP/rootsentinel-api.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/health > /dev/null && curl -fsS http://127.0.0.1:5173/login > /dev/null; then break; fi
            sleep 1
          done
          python -B scripts/browser_phase04.py
          python -B scripts/browser_phase04_negative.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sanitized-browser-evidence
          path: |
            ${{ runner.temp }}/rootsentinel-browser-evidence/browser-report.json
            ${{ runner.temp }}/rootsentinel-browser-evidence/negative-browser-report.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rootsentinel_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI service only, no password and no production data.
      ROOTSENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/rootsentinel_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: git diff --exit-code
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code
  agent:
    # Phase 05: the staging gateway agent (a pure client) against a real, disposable gateway.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -B scripts/source_corpus.py
      - name: Agent unit, fault-injection, crash-recovery and real-gateway tests
        run: python -m pytest -p no:cacheprovider
        working-directory: agent
      - name: End-to-end demonstration against a disposable gateway
        run: python -B scripts/demo_agent.py --evidence "$RUNNER_TEMP/agent-demo-${{ matrix.python-version }}.json"
      - name: Publication audit (credential patterns, private paths, generated files)
        run: python -B scripts/audit_publication.py > /dev/null
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sanitized-agent-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/agent-demo-${{ matrix.python-version }}.json
  agent-windows:
    # The agent's primary platform. Windows-specific behavior (junctions, reparse points, lstat identity).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -B scripts/source_corpus.py
      - name: Agent tests on Windows
        run: python -m pytest -p no:cacheprovider
        working-directory: agent
      - name: End-to-end demonstration on Windows
        run: python -B scripts/demo_agent.py --evidence "$env:RUNNER_TEMP/agent-demo-windows.json"
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sanitized-agent-evidence-windows
          path: ${{ runner.temp }}/agent-demo-windows.json
  container:
    # Phase 06A: build the hosted image and smoke-test it with a disposable SQLite database and
    # throwaway generated secrets. No deploy tokens exist in CI; deploying is a manual platform action.
    runs-on: ubuntu-latest
    env:
      ROOTSENTINEL_CI_ORIGIN: https://rootsentinel-ci.example
      # Uncompressed image size budget in MiB: ceil(measured x 1.2). Measured 224987716 bytes (214.6 MiB, du -sxb /)
      # in run 42601238590 on fc5aae8; ceil(214.57 x 1.2) = 258.
      IMAGE_SIZE_BUDGET_MIB: '258'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - name: Generate throwaway secrets outside the repository
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_dir="$RUNNER_TEMP/rs-container-secrets"
          mkdir -m 700 "$secrets_dir"
          (cd backend && python -B -m app.audit_keys init "$secrets_dir/audit-keys.json")
          (cd backend && python -B -m app.audit_keys init-transparency "$secrets_dir/transparency-key.json" > /dev/null)
          python -c "import secrets; print(secrets.token_urlsafe(24))" > "$secrets_dir/smoke-password"
          python -B scripts/make_account_hashes.py --out "$secrets_dir/accounts.json" --account ci-analyst:ANALYST --password-file "$secrets_dir/smoke-password"
      - name: Build the hosted image
        run: docker build --build-arg ROOTSENTINEL_COMMIT="$GITHUB_SHA" -t rootsentinel-hosted:ci .
      - name: Image size within budget
        shell: bash
        run: |
          set -euo pipefail
          # The runner uses the containerd image store, where both `docker image inspect .Size` and `docker save`
          # give the COMPRESSED layer content. The uncompressed size is the apparent size of the image's own
          # filesystem: du -sxb / inside a throwaway container (-x skips /proc, /sys and /dev).
          content_bytes="$(docker image inspect --format '{{.Size}}' rootsentinel-hosted:ci)"
          bytes="$(docker run --rm --entrypoint sh rootsentinel-hosted:ci -c 'du -sxb /' | cut -f1)"
          mib=$(( (bytes + 1048575) / 1048576 ))
          {
            echo "### Hosted image size"
            echo ""
            echo "Uncompressed (du -sxb / in the image): ${bytes} bytes = ${mib} MiB (rounded up)."
            echo "Compressed content (docker image inspect .Size, containerd store): ${content_bytes} bytes."
            echo "Budget (IMAGE_SIZE_BUDGET_MIB, uncompressed): ${IMAGE_SIZE_BUDGET_MIB:-not set, report only}."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image size: ${bytes} bytes = ${mib} MiB uncompressed (du -sxb /); compressed content ${content_bytes} bytes; budget: ${IMAGE_SIZE_BUDGET_MIB:-not set}"
          if [ -n "$IMAGE_SIZE_BUDGET_MIB" ] && [ "$mib" -gt "$IMAGE_SIZE_BUDGET_MIB" ]; then
            echo "::error::hosted image is ${mib} MiB, above the ${IMAGE_SIZE_BUDGET_MIB} MiB budget"
            exit 1
          fi
      - name: The image refuses to start without an https origin
        shell: bash
        run: |
          set +e
          output="$(docker run --rm rootsentinel-hosted:ci 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "ROOTSENTINEL_ORIGIN"
      - name: The image refuses to start without the tree-head signing key
        shell: bash
        run: |
          only="$RUNNER_TEMP/rs-audit-key-only"
          mkdir -m 700 "$only"
          cp "$RUNNER_TEMP/rs-container-secrets/audit-keys.json" "$only/"
          set +e
          output="$(docker run --rm -e ROOTSENTINEL_ORIGIN="$ROOTSENTINEL_CI_ORIGIN" -v "$only:/etc/secrets:ro" rootsentinel-hosted:ci 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "transparency signing key"
      - name: Start the container
        shell: bash
        run: |
          docker run -d --name rootsentinel -p 127.0.0.1:8000:10000 \
            -e ROOTSENTINEL_ORIGIN="$ROOTSENTINEL_CI_ORIGIN" \
            -v "$RUNNER_TEMP/rs-container-secrets:/etc/secrets:ro" \
            rootsentinel-hosted:ci
      - name: Smoke test (warm-up, hosted headers, login, ALLOW and BLOCK, single use, audit sequence)
        run: python -B scripts/smoke_public.py --base-url http://127.0.0.1:8000 --origin "$ROOTSENTINEL_CI_ORIGIN" --username ci-analyst --password-file "$RUNNER_TEMP/rs-container-secrets/smoke-password" --warmup-seconds 120 --expect-commit "$GITHUB_SHA"
      - name: The server process runs without privileges
        shell: bash
        run: |
          uid="$(docker exec rootsentinel awk '/^Uid:/ {print $2}' /proc/1/status)"
          echo "server uid: $uid"
          test "$uid" = "10001"
      - name: The server has its own HOME, so libpq skips the optional client certificate
        shell: bash
        run: |
          set -euo pipefail
          # The server's startup environment (PID 1 is the uvicorn process after the entrypoint's exec chain).
          # Read it as uid 10001: container root lacks CAP_SYS_PTRACE (Docker drops it by default), which reading
          # another uid's /proc/1/environ requires, while the same uid may read its own process.
          server_env="$(docker exec --user 10001:10001 rootsentinel sh -c "tr '\0' '\n' < /proc/1/environ")"
          server_home="$(sed -n 's/^HOME=//p' <<< "$server_env")"
          echo "server HOME: $server_home"
          test "$server_home" = "/nonexistent"
          # The environment is not cleared: the application's own settings still reach the server.
          for name in ROOTSENTINEL_ORIGIN ROOTSENTINEL_MODE ROOTSENTINEL_AUDIT_KEY_FILE; do
            grep -q "^${name}=" <<< "$server_env"
          done
          # As uid 10001 with the server's HOME, the default libpq certificate path must be absent (ENOENT, which
          # libpq skips), never EACCES (which libpq treats as fatal). The control proves the check can fail: with
          # root's HOME the same stat must be denied.
          docker exec -i --user 10001:10001 -e HOME="$server_home" rootsentinel python - <<'PY'
          import os, pwd

          assert os.geteuid() == 10001, os.geteuid()
          assert pwd.getpwuid(10001).pw_dir == "/nonexistent", pwd.getpwuid(10001).pw_dir

          def probe():
              path = os.path.expanduser("~/.postgresql/postgresql.crt")
              try:
                  os.stat(path)
              except FileNotFoundError:
                  return path, "FileNotFoundError"
              except PermissionError:
                  return path, "PermissionError"
              return path, "exists"

          path, result = probe()
          print("server HOME:", path, "->", result)
          assert result == "FileNotFoundError", result
          os.environ["HOME"] = "/root"
          path, result = probe()
          print("control, root HOME:", path, "->", result)
          assert result == "PermissionError", result
          PY
      - name: Restart and verify that bootstrap is idempotent and the data survives
        shell: bash
        run: |
          docker restart rootsentinel
          python -B scripts/smoke_public.py --base-url http://127.0.0.1:8000 --origin "$ROOTSENTINEL_CI_ORIGIN" --username ci-analyst --password-file "$RUNNER_TEMP/rs-container-secrets/smoke-password" --warmup-seconds 120
          # Two synthetic seeds. The first start registers both and activates rule set rs-policy-v2 once; the
          # restart finds both, adds no fingerprints and leaves the policy alone.
          docker logs rootsentinel 2>&1 | grep -c "assets: seeded=2 existing=0" | grep -qx 1
          docker logs rootsentinel 2>&1 | grep -c "assets: seeded=0 existing=2" | grep -qx 1
          docker logs rootsentinel 2>&1 | grep -c "policy: rule set rs-policy-v2 activated" | grep -qx 1
          docker logs rootsentinel 2>&1 | grep -c "policy: rule set rs-policy-v2 not changed" | grep -qx 1
          docker logs rootsentinel 2>&1 | grep -c "profiles: seed assets given missing fingerprints=0" | grep -qx 2
      - name: Container logs
        if: always()
        run: docker logs rootsentinel || true
      - name: Remove the container
        if: always()
        run: docker rm -f rootsentinel || true
