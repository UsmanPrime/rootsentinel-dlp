name: Backend and frontend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pytest
        working-directory: backend
      - run: python -B scripts/fixtures.py
      - run: python -B scripts/frontend_contracts.py --check
      - run: git diff --exit-code
  browser:
    runs-on: ubuntu-latest
    env:
      ROOTSENTINEL_ORIGIN: http://127.0.0.1:5173
      ROOTSENTINEL_API_PORT: '8000'
      ROOTSENTINEL_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: python -m pip install -r backend/requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Real browser and adversarial acceptance
        shell: bash
        run: |
          export ROOTSENTINEL_BROWSER_STATE="$RUNNER_TEMP/rootsentinel-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          (cd backend && python -B -m tests.browser_server) > "$RUNNER_TEMP/rootsentinel-api.log" 2>&1 &
          backend_pid=$!
          (cd frontend && npm run dev -- --port 5173 --strictPort) > "$RUNNER_TEMP/rootsentinel-ui.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          python -B scripts/browser_phase04.py
          python -B scripts/browser_phase04_negative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-browser-evidence
          path: |
            docs/evidence/phase-04-browser.json
            docs/evidence/phase-04-negative-browser.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rootsentinel_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI service only, no password and no production data.
      ROOTSENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/rootsentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: git diff --exit-code
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code
  agent:
    # Phase 05: the staging gateway agent (a pure client) against a real, disposable gateway.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -B scripts/source_corpus.py
      - name: Agent unit, fault-injection, crash-recovery and real-gateway tests
        run: python -m pytest -p no:cacheprovider
        working-directory: agent
      - name: End-to-end demonstration against a disposable gateway
        run: python -B scripts/demo_phase05.py --evidence "$RUNNER_TEMP/phase-05-demo-${{ matrix.python-version }}.json"
      - name: Publication audit (credential patterns, private paths, generated files)
        run: python -B scripts/audit_publication.py > /dev/null
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-agent-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/phase-05-demo-${{ matrix.python-version }}.json
  agent-windows:
    # The agent's primary platform. Windows-specific behavior (junctions, reparse points, lstat identity).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -B scripts/source_corpus.py
      - name: Agent tests on Windows
        run: python -m pytest -p no:cacheprovider
        working-directory: agent
      - name: End-to-end demonstration on Windows
        run: python -B scripts/demo_phase05.py --evidence "$env:RUNNER_TEMP/phase-05-demo-windows.json"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-agent-evidence-windows
          path: ${{ runner.temp }}/phase-05-demo-windows.json
